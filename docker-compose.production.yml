volumes:
  pg_data_production:
  static_volume:
  frontend_volume:

services:
  db:
    image: postgres:13.10
    env_file: .env
    restart: always
    volumes:
      - pg_data_production:/var/lib/postgresql/data
  backend:
    image: tosky26/taski_backend
    restart: always
    env_file: .env
    volumes:
      - static_volume:/app/staticfiles
  frontend:
    image: tosky26/taski_frontend
    restart: always
    env_file: .env
    volumes:
      - frontend_volume:/app/build
  gateway:
    image: tosky26/taski_gateway
    restart: always
    env_file: .env
    volumes:
      - static_volume:/staticfiles
      - frontend_volume:/frontend
    ports:
      - 8000:80
