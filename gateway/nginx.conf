server {
    listen 80;
    server_name toskytaski.hopto.org;

    location /api/ {
        proxy_set_header Host $host;
        proxy_pass http://backend:8000/api/;
    }

    location /admin/ {
        proxy_set_header Host $host;
        proxy_pass http://backend:8000/admin/;
    }

    location /static/ {
        alias /staticfiles/static/;
    }

    location / {
        root /staticfiles;
        try_files $uri /index.html;
    }
}
