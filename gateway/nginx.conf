server {
  listen 80;

  location /api/ {
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    proxy_pass http://backend:8000;
  }

  location /admin/ {
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    proxy_pass http://backend:8000;
  }

  # 🔥 САМЫЕ СПЕЦИФИЧНЫЕ СТАТИЧЕСКИЕ ПУТИ (ДОЛЖНЫ БЫТЬ ВЫШЕ /static/)
  location /static/js/ {
    alias /frontend/static/js/;
  }

  location /static/css/ {
    alias /frontend/static/css/;
  }

  # Django static (после них!)
  location /static/ {
    alias /staticfiles/;
  }

  # React SPA
  location / {
    root /frontend;
    index index.html;
    try_files $uri /index.html;
  }
}
